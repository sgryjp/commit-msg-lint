repos:
  - repo: local
    hooks:
      - id: commit-msg-lint
        name: commit-msg-lint
        entry: cargo run --quiet --locked -- --edit
        language: system
        stages: [commit-msg]
        always_run: true
  - repo: https://github.com/sgryjp/cjkfmt
    rev: 0.0.10
    hooks:
      - id: cjkfmt-check
        stages: [pre-commit]
