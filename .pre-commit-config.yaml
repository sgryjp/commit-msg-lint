repos:
  - repo: local
    hooks:
      - id: sync-config-schema
        name: sync configuration schema
        entry: python scripts/sync_config_schema.py
        language: python
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: commit-msg-lint
        name: commit-msg-lint
        entry: cargo run --quiet --locked -- --edit
        language: system
        stages: [commit-msg]
        always_run: true
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.5
    hooks:
      - id: rumdl-check
        stages: [pre-commit]
