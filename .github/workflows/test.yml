name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade prek
      - run: prek validate-config .pre-commit-config.yaml
      - run: prek run --all-files

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace
        timeout-minutes: 15
      - if: matrix.os == 'ubuntu-latest'
        run: python -m pip install --upgrade pre-commit
      - if: matrix.os == 'ubuntu-latest'
        run: pre-commit validate-manifest .pre-commit-hooks.yaml
      - if: matrix.os == 'ubuntu-latest'
        run: python tests/test_pre_commit_hook.py
      - run: python scripts/check_fixture_discovery.py
      - run: python -B -m unittest discover -s tests -p test_sync_config_schema.py
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.11 --with-requirements scripts/check_translation_sync.py python -B -m unittest discover -s tests -p test_check_translation_sync.py
      - run: python -B -m unittest discover -s tests -p test_translation_sync_scope.py

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/site-ui.test.cjs

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked -p commit-msg-lint-web --target wasm32-unknown-unknown
