[package]
name = "commit-msg-lint"
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde"] }
serde_with = { version = "3.24", default-features = false, features = ["std"] }
unicode-width = "=0.2.2"
regex-lite = "0.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tempfile = "3"

[build-dependencies]
glob = "0.3"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
rstest = "0.27"
toml = "0.9"

[workspace]
members = [".", "web"]
